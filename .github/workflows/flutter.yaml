name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
  # Manual trigger. Runs only the `regenerate-goldens` job below, which
  # rewrites the golden reference images on the pinned macOS runner and opens a
  # PR with the result. Golden references are never regenerated on a developer
  # machine, because font rasterisation differs between machines.
  workflow_dispatch:

# Flutter is pinned by exact version, never `channel: stable`. When stable moved
# to 3.50.1 / Dart 3.14 the formatter changed style and `Validate` went red on
# files no PR had touched (see #162). Bump these deliberately, in their own PR.
#
# FLUTTER_FLOOR is the Compatibility Floor: the oldest Flutter the package
# supports (pubspec `environment.flutter`). FLUTTER_LATEST is the newest
# verified release; publish.yaml pins the same version.
env:
  FLUTTER_FLOOR: '3.35.0'
  FLUTTER_LATEST: '3.50.1'

permissions:
  contents: read

jobs:
  validate-floor:
    name: Validate (floor, Flutter 3.35.0)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_FLOOR }}
          channel: stable
          cache: true
      # Goldens are skipped here: validate.sh is run without --goldens. The
      # lockfiles are resolved for FLUTTER_LATEST, so `pub get` on the floor
      # rewrites them (flutter_test pins different transitive versions per
      # SDK). That drift is expected and nothing checks for it; the floor is
      # enforced by analyze and test passing on this SDK. See CONTRIBUTING.md,
      # "Lockfiles and the Compatibility Floor".
      - name: Run Flutter validation script
        run: ./validate.sh
        shell: bash
      - name: Show lockfile drift (informational)
        if: always()
        run: git diff --stat -- pubspec.lock example/pubspec.lock || true

  validate-latest:
    name: Validate (latest, Flutter 3.50.1, goldens)
    if: github.event_name != 'workflow_dispatch'
    # Pinned macOS image, not macos-latest. Golden references are generated by
    # `regenerate-goldens` on this same image and Flutter version.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_LATEST }}
          channel: stable
          cache: true
      - name: Run Flutter validation script with goldens
        run: ./validate.sh --goldens
        shell: bash
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  build-android:
    name: Example build (Android APK)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_LATEST }}
          channel: stable
          cache: true
      - name: Build debug APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

  build-ios:
    name: Example build (iOS simulator)
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_LATEST }}
          channel: stable
          cache: true
      - name: Select Xcode 27.2
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app
          fi
          xcodebuild -version
      - name: Build iOS simulator app
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --simulator --debug

  build-web:
    name: Example build (web)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_LATEST }}
          channel: stable
          cache: true
      - name: Build web
        working-directory: example
        run: |
          flutter pub get
          flutter build web

  integration-android:
    name: Android integration tests (API 36)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_LATEST }}
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 36 passes locally with the default target (5/5, see #162);
          # add `target: google_apis` only if CI shows no default image.
          api-level: 36
          arch: x86_64
          profile: pixel_6
          script: cd example && flutter pub get && flutter test integration_test

  regenerate-goldens:
    name: Regenerate golden references
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # Must match validate-latest: same image, same Flutter version.
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_LATEST }}
          channel: stable
          cache: true
      - name: Regenerate goldens
        run: |
          flutter pub get
          flutter test --update-goldens --dart-define=GOLDENS=true test/render_golden_test.dart test/image_test.dart
      - name: Show changed references
        run: git status --short -- test
      # A PR opened with GITHUB_TOKEN does not trigger the CI workflow itself.
      # Close and reopen it (or push an empty commit) to get CI evidence before
      # merging.
      - name: Open a PR with the regenerated references
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ci/regenerate-goldens
          delete-branch: true
          add-paths: |
            test/**/*.png
          commit-message: 'test: regenerate golden references on macos-26 / Flutter ${{ env.FLUTTER_LATEST }}'
          title: 'test: regenerate golden references (Flutter ${{ env.FLUTTER_LATEST }}, macos-26)'
          body: |
            Golden reference images regenerated by the `Regenerate golden references` job
            (`workflow_dispatch`) on `macos-26` with Flutter ${{ env.FLUTTER_LATEST }}.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Review every changed image before merging. This PR was opened with
            `GITHUB_TOKEN`, so CI does not run on it automatically: close and
            reopen it to trigger CI.
