name: flutter_markdown_plus
description: A Markdown renderer for Flutter. Create rich text output,
  including text styles, tables, links, and more, from plain text data
  formatted with simple Markdown tags.
repository: https://github.com/foresightmobile/flutter_markdown_plus
issue_tracker: https://github.com/foresightmobile/flutter_markdown_plus/issues
documentation: https://pub.dev/documentation/flutter_markdown_plus/latest/
version: 1.0.12

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  markdown: ^7.3.1
  meta: ^1.16.0
  path: ^1.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.10
  # Pinned: 5.6.4 is the only mockito that resolves on the Compatibility Floor.
  # 5.6.5 and 5.7.0+ both pull an analyzer needing meta ^1.18.0, which conflicts
  # with Flutter 3.35.0's flutter_test-pinned meta 1.16.0. Raise this when the
  # floor rises past 3.35.0.
  mockito: 5.6.4
  standard_message_codec: ^0.0.1+4

topics:
  - markdown
  - widgets

screenshots:
  - description: Rich text, emphasis, blockquotes and lists rendered from Markdown.
    path: screenshots/formatting.png
  - description: GitHub Flavored Markdown tables and task-list checkboxes.
    path: screenshots/tables.png
  - description: Fenced and inline code blocks with monospace styling.
    path: screenshots/code.png

formatter:
  page_width: 120
